{% extends 'usuarios/base.html' %}
{% block title %}Publicar Solicitud - Kuxee{% endblock %}

{% block extra_css %}
<style>
    .form-container { max-width: 700px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .form-control, .form-select { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    .btn-publicar { width: 100%; background: #4f46e5; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    .btn-publicar:hover { background: #4338ca; }
</style>
{% endblock %}

{% block contenido %}
<div class="form-container">
    <h2 style="color: #1e293b; margin-bottom: 10px;">Publicar nueva solicitud</h2>
    <p style="color: #64748b; margin-bottom: 30px;">Describe lo que necesitas para que los maestros te contacten.</p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label style="font-weight: bold;">Título de tu solicitud</label>
        <input type="text" name="titulo" class="form-control" placeholder="Ej: Necesito reparar el techo por goteras" required>

        <label style="font-weight: bold;">Categoría / Oficio requerido</label>
        <select name="oficio" class="form-select" required>
            <option value="" disabled selected>Selecciona un oficio</option>
            {% for of in oficios %}
                <option value="{{ of.0 }}">{{ of.1 }}</option>
            {% endfor %}
        </select>

        <label style="font-weight: bold;">Descripción detallada</label>
        <textarea name="descripcion" class="form-control" rows="5" placeholder="Explica con detalles qué necesitas..." required></textarea>

        <label style="font-weight: bold;">Imágenes de referencia (Max 10)</label>
        <input type="file" name="archivos" class="form-control" multiple accept="image/*,video/*">

        <button type="submit" class="btn-publicar">Publicar Solicitud</button>
    </form>
</div>
{% endblock %}
