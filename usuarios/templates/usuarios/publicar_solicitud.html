{% extends 'usuarios/base.html' %}
{% block title %}Publicar Solicitud - Kuxee{% endblock %}

{% block extra_css %}
<style>
    /* Seguridad global contra desbordamientos */
    html, body { max-width: 100%; overflow-x: hidden; }

    .form-wrapper { padding: 0 15px; box-sizing: border-box; }
    .form-container { max-width: 700px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-sizing: border-box; }
    
    .form-title { color: #1e293b; margin: 0 0 10px 0; font-size: 1.85rem; line-height: 1.2; }
    .form-subtitle { color: #64748b; margin: 0 0 28px 0; font-size: 1rem; line-height: 1.5; }

    .form-label { display: block; font-weight: bold; color: #334155; font-size: 0.95rem; }
    .form-control, .form-select { width: 100%; padding: 12px 14px; margin-top: 8px; margin-bottom: 22px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; box-sizing: border-box; font-family: inherit; outline: none; transition: border-color 0.2s, box-shadow 0.2s; background-color: #ffffff; }
    .form-control:focus, .form-select:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12); }
    textarea.form-control { resize: vertical; min-height: 120px; }

    /* Ajuste para que el input de archivos no desborde en celulares */
    input[type="file"].form-control { padding: 10px; background: #f8fafc; font-size: 0.92rem; cursor: pointer; }

    .btn-publicar { width: 100%; background: #4f46e5; color: white; padding: 14px 20px; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: background 0.2s; box-sizing: border-box; }
    .btn-publicar:hover { background: #4338ca; }

    /* =========================================
       DISEÑO RESPONSIVO (TABLETS Y CELULARES)
       ========================================= */
    @media (max-width: 768px) {
        .form-wrapper { padding: 0 12px; }
        .form-container { margin: 20px auto; padding: 24px 18px; border-radius: 10px; }
        
        .form-title { font-size: 1.5rem; }
        .form-subtitle { font-size: 0.92rem; margin-bottom: 22px; }
        
        .form-control, .form-select { margin-bottom: 18px; padding: 11px 12px; }
        .btn-publicar { padding: 14px; font-size: 1rem; }
    }
</style>
{% endblock %}

{% block contenido %}
<div class="form-wrapper">
    <div class="form-container">
        <h2 class="form-title">Publicar nueva solicitud</h2>
        <p class="form-subtitle">Describe lo que necesitas para que los maestros te contacten.</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label class="form-label">Título de tu solicitud</label>
            <input type="text" name="titulo" class="form-control" placeholder="Ej: Necesito reparar el techo por goteras" required>

            <label class="form-label">Categoría / Oficio requerido</label>
            <select name="oficio" class="form-select" required>
                <option value="" disabled selected>Selecciona un oficio</option>
                {% for of in oficios %}
                    <option value="{{ of.0 }}">{{ of.1 }}</option>
                {% endfor %}
            </select>

            <label class="form-label">Descripción detallada</label>
            <textarea name="descripcion" class="form-control" rows="5" placeholder="Explica con detalles qué necesitas..." required></textarea>

            <label class="form-label">Imágenes o videos de referencia (Máx. 10)</label>
            <input type="file" name="archivos" class="form-control" multiple accept="image/*,video/*">

            <button type="submit" class="btn-publicar">Publicar Solicitud</button>
        </form>
    </div>
</div>
{% endblock %}
